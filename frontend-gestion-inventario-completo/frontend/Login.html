<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Gestión de Inventario</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="ASSETS/CSS/styles.css" />
</head>
<body class="pagina-auth">

  <main class="contenedor-auth">
    <div class="tarjeta-auth card shadow-lg border-0">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <div class="logo-marca mb-3">
            <i class="bi bi-boxes"></i>
          </div>
          <h1 class="h4 fw-bold mb-1">Gestión de Inventario</h1>
          <p class="text-muted small mb-0">Ingresa con tu cuenta para continuar</p>
        </div>

        <div id="contenedorAlerta"></div>

        <form id="formularioLogin" novalidate>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input
                type="email"
                class="form-control"
                id="correo"
                name="correo"
                placeholder="nombre@empresa.com"
                autocomplete="username"
                required
              />
            </div>
            <div class="invalid-feedback d-block" id="errorCorreo"></div>
          </div>

          <div class="mb-3">
            <label for="contrasena" class="form-label">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="contrasena"
                name="contrasena"
                placeholder="Tu contraseña"
                autocomplete="current-password"
                required
              />
              <button class="btn btn-outline-secondary" type="button" id="botonMostrarContrasena" tabindex="-1">
                <i class="bi bi-eye" id="iconoMostrarContrasena"></i>
              </button>
            </div>
            <div class="invalid-feedback d-block" id="errorContrasena"></div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2" id="botonLogin">
            <span class="spinner-border spinner-border-sm d-none" id="spinnerLogin" role="status" aria-hidden="true"></span>
            <span id="textoBotonLogin">Iniciar sesión</span>
          </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
          Sistema de uso interno · Los usuarios son creados por un administrador
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="ASSETS/JS/config.js"></script>
  <script src="ASSETS/JS/login.js"></script>
</body>
</html>
